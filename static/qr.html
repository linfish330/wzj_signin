<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>二维码签到</title>
        <style>
            :root {
                /* CloudHouseRecruitment 设计风格 Tokens */
                --primary: #2870A1;
                --primary-strong: #1F5C86;
                --primary-soft: #EAF3F9;
                --primary-tint: #F4F9FC;

                --bg: #F5F7FA;
                --surface: #FFFFFF;
                --surface-subtle: #FAFBFC;
                --line: #E5EAF0;
                --line-strong: #D6DEE7;
                --text: #17222E;
                --text-1: #17222E;
                --text-2: #4E5C6B;
                --text-3: #8894A1;

                --ok: #2E7D58;
                --ok-soft: #E7F3ED;
                --warn: #96691B;
                --warn-soft: #FAF2E3;
                --danger: #B5473F;
                --danger-soft: #FAECEB;

                --radius-card: 14px;
                --radius-ctl: 8px;
                --radius-full: 999px;

                --shadow-card: 0 1px 2px rgba(23, 34, 46, 0.04), 0 4px 16px rgba(23, 34, 46, 0.04);
                --shadow-lg: 0 8px 30px rgba(23, 34, 46, 0.12);

                --font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
                --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "JetBrains Mono", monospace;

                --transition-fast: 0.15s ease;
                --transition-normal: 0.22s ease;

                /* 兼容映射 */
                --color-primary: var(--primary);
                --color-primary-dark: var(--primary-strong);
                --color-text-light: var(--text-2);
                --border: var(--line);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                margin: 0;
                font-family: var(--font-family);
                background: var(--bg);
                color: var(--text-1);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                line-height: 1.55;
            }

            .wrap {
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 24px;
            }

            .card {
                width: min(500px, 100%);
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: var(--radius-card);
                box-shadow: var(--shadow-card);
                overflow: hidden;
                transition: box-shadow var(--transition-normal), border-color var(--transition-normal);
            }

            .card:hover {
                border-color: var(--line-strong);
                box-shadow: var(--shadow-lg);
            }

            .head {
                padding: 16px 20px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                border-bottom: 1px solid var(--line);
                background: var(--surface-subtle);
            }

            h1 {
                margin: 0;
                font-family: var(--font-family);
                font-size: 16px;
                font-weight: 600;
                color: var(--text-1);
                letter-spacing: 0.01em;
            }

            .time {
                font-family: var(--font-mono);
                font-size: 12px;
                color: var(--text-3);
                white-space: nowrap;
                font-variant-numeric: tabular-nums;
            }

            .body {
                padding: 20px;
                display: grid;
                gap: 16px;
            }

            .hint {
                font-size: 13px;
                color: var(--text-2);
                line-height: 1.5;
            }

            .qrbox {
                width: 100%;
                display: grid;
                place-items: center;
                padding: 16px;
                border-radius: var(--radius-ctl);
                border: 1px solid var(--line);
                background: var(--surface-subtle);
                min-height: 270px;
            }

            .qrimg {
                width: 230px;
                height: 230px;
                border-radius: 6px;
                border: 1px solid var(--line);
                background: #ffffff;
                display: none;
            }

            .spinner {
                width: 38px;
                height: 38px;
                border-radius: var(--radius-full);
                border: 3px solid var(--primary-soft);
                border-top-color: var(--primary);
                animation: spin 0.8s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .row {
                display: flex;
                gap: 10px;
                justify-content: space-between;
                align-items: center;
            }

            .pill,
            .ghost {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                height: 38px;
                padding: 0 16px;
                font-size: 13.5px;
                font-weight: 500;
                border-radius: var(--radius-ctl);
                cursor: pointer;
                text-decoration: none;
                transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), transform 0.05s ease;
                flex: 1;
            }

            .pill {
                border: 1px solid var(--line-strong);
                background: var(--surface);
                color: var(--text-2);
            }

            .pill:hover:not(:disabled) {
                border-color: var(--primary);
                color: var(--primary-strong);
                background: var(--primary-tint);
            }

            .pill:active:not(:disabled),
            .ghost:active:not(:disabled) {
                transform: scale(0.985);
            }

            .pill.primary {
                background: var(--primary);
                border-color: var(--primary);
                color: #ffffff;
            }

            .pill.primary:hover:not(:disabled) {
                background: var(--primary-strong);
                border-color: var(--primary-strong);
            }

            .ghost {
                background: transparent;
                border: 1px solid var(--line-strong);
                color: var(--text-2);
            }

            .ghost:hover:not(:disabled) {
                color: var(--primary-strong);
                border-color: var(--primary);
                background: var(--primary-tint);
            }

            .progress {
                height: 6px;
                background: var(--line);
                border-radius: var(--radius-full);
                overflow: hidden;
            }

            .bar {
                height: 100%;
                width: 0%;
                background: var(--primary);
                border-radius: var(--radius-full);
                transition: width 0.2s linear;
            }

            .meta {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                font-size: 12.5px;
                color: var(--text-2);
                font-weight: 500;
            }

            .mono {
                font-family: var(--font-mono);
                word-break: break-all;
                font-variant-numeric: tabular-nums;
                background: var(--primary-tint);
                padding: 2px 6px;
                border-radius: 4px;
                border: 1px solid var(--line);
                color: var(--primary-strong);
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <div class="card">
                <div class="head">
                    <h1>二维码签到</h1>
                    <div class="time" id="datetime">--</div>
                </div>

                <div class="body">
                    <div class="hint" id="statusText">正在等待二维码生成（自动刷新中）…</div>

                    <div class="qrbox">
                        <div class="spinner" id="spinner" aria-label="Loading"></div>
                        <img id="qrcodeImage" class="qrimg" alt="扫描此二维码签到" />
                    </div>

                    <div class="meta">
                        <div>
                            signId：<span class="mono" id="signIdText">--</span>
                        </div>
                        <div>剩余：<span id="countdown">--</span></div>
                    </div>

                    <div class="progress"><div class="bar" id="progressBar"></div></div>

                    <div class="row">
                        <button class="pill primary" id="refreshBtn" type="button">手动刷新</button>
                        <button class="ghost" id="copyBtn" type="button">复制二维码链接</button>
                    </div>

                    <div class="hint mono" id="qrcodeText">（二维码链接会显示在这里）</div>
                </div>
            </div>
        </div>

        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const sign = urlParams.get("sign") || "";
            const course = urlParams.get("course") || "";

            const statusText = document.getElementById("statusText");
            const datetimeEl = document.getElementById("datetime");
            const signIdText = document.getElementById("signIdText");
            const countdownEl = document.getElementById("countdown");
            const progressBar = document.getElementById("progressBar");
            const qrcodeText = document.getElementById("qrcodeText");
            const qrcodeImage = document.getElementById("qrcodeImage");
            const spinner = document.getElementById("spinner");
            const refreshBtn = document.getElementById("refreshBtn");
            const copyBtn = document.getElementById("copyBtn");

            signIdText.textContent = sign || "--";

            let lastQrUrl = "";
            let triedFallback = false;
            let cycleStartAt = 0;
            let lastCycleIndex = 0;
            const TTL_MS = 10 * 1000;

            function updateTime() {
                const now = new Date();
                const timeString = now.toLocaleTimeString("zh-CN", { hour12: false });
                const dateString = now.toLocaleDateString("zh-CN");
                datetimeEl.textContent = `${dateString} ${timeString}`;
            }

            async function safeReadJson(response) {
                try {
                    return await response.json();
                } catch {
                    return null;
                }
            }

            function renderQr(qrUrl) {
                qrcodeText.textContent = qrUrl;
                triedFallback = false;
                // 优先直接显示（若 qrUrl 本身就是图片地址/ dataURL，这一步就能直接出图）
                qrcodeImage.dataset.mode = "direct";
                qrcodeImage.src = qrUrl;
                qrcodeImage.style.display = "block";
                spinner.style.display = "none";
            }

            // 若 direct 模式加载失败（例如 qrUrl 不是图片），自动回退为“把链接编码成二维码”
            qrcodeImage.addEventListener("error", () => {
                if (triedFallback) return;
                if (qrcodeImage.dataset.mode !== "direct") return;
                if (!lastQrUrl) return;

                triedFallback = true;
                qrcodeImage.dataset.mode = "encoded";
                qrcodeImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(lastQrUrl)}`;
            });

            function renderWaiting() {
                qrcodeImage.style.display = "none";
                spinner.style.display = "block";
                qrcodeText.textContent = "（二维码链接会显示在这里）";
            }

            function tickCountdown() {
                if (!cycleStartAt) {
                    countdownEl.textContent = "--";
                    progressBar.style.width = "0%";
                    return;
                }
                const now = Date.now();
                const elapsed = Math.max(0, now - cycleStartAt);
                const cycleIndex = Math.floor(elapsed / TTL_MS);

                // 每进入一个新周期就尝试拉取新二维码（不会导致页面重载）
                if (cycleIndex !== lastCycleIndex) {
                    lastCycleIndex = cycleIndex;
                    fetchQRCode({ forceHint: false });
                }

                const inCycleElapsed = elapsed % TTL_MS;
                const left = TTL_MS - inCycleElapsed;
                countdownEl.textContent = (left / 1000).toFixed(1) + "s";
                progressBar.style.width = ((left / TTL_MS) * 100).toFixed(2) + "%";

                // 如果超过 1 个周期仍未拿到新码，提示但不隐藏二维码（避免“整页刷新”观感）
                if (cycleIndex >= 1) {
                    statusText.textContent = "正在等待新二维码（自动刷新中）…";
                }
            }

            async function fetchQRCode({ forceHint } = { forceHint: false }) {
                if (!sign) {
                    statusText.textContent = "缺少 sign 参数";
                    renderWaiting();
                    return;
                }
                try {
                    const resp = await fetch("/qr/" + encodeURIComponent(sign), { method: "GET", cache: "no-store" });
                    const data = await safeReadJson(resp);
                    const qrUrl = data && data.qrUrl ? String(data.qrUrl) : "";

                    if (!qrUrl) {
                        if (forceHint || !lastQrUrl) {
                            statusText.textContent = "正在等待二维码生成（自动刷新中）…";
                            renderWaiting();
                        }
                        return;
                    }

                    if (qrUrl !== lastQrUrl) {
                        lastQrUrl = qrUrl;
                        renderQr(qrUrl);
                        // 只有二维码变化时才重置周期
                        cycleStartAt = Date.now();
                        lastCycleIndex = 0;
                        statusText.textContent = "二维码已更新（自动刷新中）";
                    } else {
                        // 二维码未变化：不重置周期，避免进度条跳回起点
                        if (!cycleStartAt) {
                            cycleStartAt = Date.now();
                            lastCycleIndex = 0;
                        }
                        statusText.textContent = "二维码有效期内（自动刷新中）";
                    }
                } catch (e) {
                    statusText.textContent = "获取二维码失败，请检查网络或后端日志";
                }
            }

            refreshBtn.addEventListener("click", () => fetchQRCode({ forceHint: true }));
            copyBtn.addEventListener("click", async () => {
                if (!lastQrUrl) return;
                try {
                    await navigator.clipboard.writeText(lastQrUrl);
                    statusText.textContent = "已复制二维码链接";
                } catch {
                    statusText.textContent = "复制失败：浏览器不允许或不支持剪贴板 API";
                }
            });

            // 初始化
            updateTime();

            // 如果带了 courseId，就先触发一次后端 WS 监听（避免服务重启/较晚打开导致一直无码）
            (async () => {
                if (course && sign) {
                    try {
                        await fetch(
                            "/qrws/start?courseId=" + encodeURIComponent(course) + "&signId=" + encodeURIComponent(sign),
                            { method: "GET", cache: "no-store" }
                        );
                    } catch {
                        // ignore
                    }
                }
            })();

            fetchQRCode({ forceHint: true });

            // 时间显示
            setInterval(updateTime, 1000);
            // 自动轮询二维码（解决“必须手动刷新才出现”）
            setInterval(fetchQRCode, 400);
            // 倒计时条
            setInterval(tickCountdown, 100);
        </script>
    </body>
</html>
